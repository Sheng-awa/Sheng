<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sheng-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对弈 ✿ 小圣的小窝</title>
  <meta name="description" content="小圣的对弈角：中国象棋人机对战，悔棋求和还有小灯泡提示。" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       对弈（games.html · 单文件实现：左侧导航 + 象棋人机对战）
       ============================================================ */
    :root {
      --pink: #ec6f9c;
      --pink-deep: #d94f82;
      --ink: #6f5560;
      --card-bg: #ffffff;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }
    html[data-theme="dark"] {
      --pink: #f28bb4;
      --pink-deep: #ff9ec6;
      --ink: #e8d9e3;
      --card-bg: #2f2633;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background-color: #fdeef4;
      background-image:
        linear-gradient(rgba(238, 152, 188, .15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(238, 152, 188, .15) 1px, transparent 1px);
      background-size: 26px 26px;
      padding: 40px 24px 56px 244px;   /* 左侧给导航留位 */
      overflow-x: hidden;
    }
    html[data-theme="dark"] body {
      background-color: #241b27;
      background-image:
        linear-gradient(rgba(242, 167, 195, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242, 167, 195, .08) 1px, transparent 1px);
    }

    /* ---------- 左侧导航（和小窝同款） ---------- */
    .side-nav {
      position: fixed; left: 0; top: 0; bottom: 0; width: 220px; z-index: 40;
      background: rgba(255, 253, 248, .85);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-right: 1.5px solid rgba(236, 143, 178, .3);
      display: flex; flex-direction: column; padding: 26px 14px; gap: 4px;
    }
    /* 夜晚模式：侧栏等其他区域跟随变暗；只有棋盘方框保持白色 */
    html[data-theme="dark"] .side-nav {
      background: rgba(34, 25, 33, .88);
      border-right-color: rgba(242, 167, 195, .25);
    }
    .side-nav__logo { font-size: 1.45rem; color: #5f4450; padding: 0 10px 18px; letter-spacing: .04em; }
    html[data-theme="dark"] .side-nav__logo { color: #e9c8d8; }
    .side-nav__logo span { color: var(--pink); }
    .side-nav__item {
      display: flex; align-items: center; gap: 10px; padding: 11px 14px;
      border: none; background: none; border-radius: 12px; cursor: pointer;
      font-family: inherit; font-size: 1.02rem; color: var(--ink); text-align: left; text-decoration: none;
      transition: background .2s var(--ease), color .2s;
    }
    .side-nav__item:hover { background: rgba(236, 143, 178, .15); }
    html[data-theme="dark"] .side-nav__item:hover { background: rgba(242, 167, 195, .22); }
    .side-nav__item.is-active { background: var(--pink); color: #fff; }
    .side-nav__spacer { flex: 1; }
    .side-nav__home { color: var(--pink-deep); }

    /* 中国象棋小徽标：红色圆底白字「帅」（替代国际象棋 emoji） */
    .chess-ico {
      display: inline-grid;
      place-items: center;
      width: 1.7em;
      height: 1.7em;
      border-radius: 50%;
      background: linear-gradient(135deg, #f25d5d, #c93a3a);
      color: #fff;
      font-size: 0.72em;
      font-style: normal;
      line-height: 1;
      box-shadow: 0 2px 6px rgba(200, 60, 60, 0.35);
      flex: none;
    }


    /* ---------- 翻页入场：像翻开书页一样揭开页面（与跳转纱幕同色，翻过去不突兀） ---------- */
    .page-open {
      position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      background: linear-gradient(165deg, #efe6fb 0%, #e4d5f6 55%, #d5c1f0 100%);
      transform-origin: left center;
      animation: page-open-out .62s var(--ease) .06s both;
    }
    html[data-theme="dark"] .page-open {
      background: linear-gradient(165deg, #2a2140 0%, #32284f 55%, #3b2f5c 100%);
    }
    @keyframes page-open-out {
      from { transform: perspective(1600px) rotateY(0deg); opacity: 1; }
      to   { transform: perspective(1600px) rotateY(-88deg); opacity: 0; }
    }

    .stage { max-width: 1100px; margin: 0 auto; }

    .xq-header { text-align: center; margin-bottom: 18px; }
    .xq-title { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 400; color: #5f4450; letter-spacing: .06em; }
    html[data-theme="dark"] .xq-title { color: #e9c8d8; }
    .xq-title span { color: var(--pink); }
    .xq-sub { color: #a57e8b; font-size: 1rem; margin-top: 6px; }
    html[data-theme="dark"] .xq-sub { color: #a28798; }

    /* ---------- 主区：棋盘 + 侧栏 ---------- */
    .xq-main { display: flex; gap: 24px; justify-content: center; align-items: flex-start; }
    .xq-board-wrap {
      background: linear-gradient(180deg, #fffdf8 0%, #fff9ef 100%);
      border-radius: 16px; padding: 14px;
      box-shadow: 0 12px 28px rgba(178, 110, 140, .22);
    }
    #board { display: block; width: min(528px, calc(100vw - 300px)); height: auto; cursor: pointer; }
    #gboard { display: block; width: min(720px, calc(100vw - 300px)); height: auto; cursor: pointer; }

    .xq-side { width: 300px; display: flex; flex-direction: column; gap: 14px; }
    .panel {
      background: linear-gradient(180deg, #fffdf8 0%, #fff9ef 100%);
      border-radius: 14px; padding: 14px 16px;
      box-shadow: 0 8px 20px rgba(178, 110, 140, .18);
    }
    html[data-theme="dark"] .panel {
      background: linear-gradient(180deg, #2f2633 0%, #2a222e 100%);
      box-shadow: 0 8px 20px rgba(0, 0, 0, .35);
    }
    #status { font-size: 1.12rem; color: #5f4450; text-align: center; padding: 4px 0 2px; }
    html[data-theme="dark"] #status { color: #e9c8d8; }
    #status.check { color: #d94f82; }

    .ctl-row label { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; color: #a57e8b; }
    html[data-theme="dark"] .ctl-row label { color: #a28798; }
    select {
      font-family: inherit; font-size: .95rem; color: var(--ink);
      padding: 7px 10px; border-radius: 10px; border: 1.5px solid rgba(236, 111, 156, .35);
      background: var(--card-bg); outline: none; cursor: pointer;
    }
    html[data-theme="dark"] select { border-color: rgba(242, 167, 195, .35); }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .btns button {
      flex: 1 1 calc(50% - 4px); font-family: inherit; font-size: .95rem; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, #f48fb1, var(--pink));
      border: none; border-radius: 999px; padding: 9px 0;
      box-shadow: 0 4px 12px rgba(236, 111, 156, .3);
      transition: transform .2s var(--ease), box-shadow .2s var(--ease);
    }
    .btns button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(236, 111, 156, .4); }
    .btns button:disabled { opacity: .4; cursor: default; box-shadow: none; }
    .btns button.ghost { background: var(--card-bg); color: var(--pink-deep); border: 1.5px solid rgba(236, 111, 156, .4); box-shadow: none; }
    /* 小灯泡提示 */
    #hintBtn { flex: 1 1 100%; background: linear-gradient(135deg, #f7c948, #eda93a); color: #6b4f10; }
    #hintBtn:hover:not(:disabled) { box-shadow: 0 8px 16px rgba(237, 169, 58, .45); }

    /* ---------- 在建占位 ---------- */
    .wip-card {
      max-width: 420px; margin: 60px auto 0; text-align: center;
      background: rgba(255, 253, 248, .6);
      border: 2.5px dashed rgba(236, 143, 178, .55); border-radius: 16px;
      padding: 44px 30px;
    }
    html[data-theme="dark"] .wip-card { background: rgba(47, 38, 51, .72); }
    .wip-card__icon { font-size: 3rem; margin-bottom: 14px; }
    .wip-card h3 { font-weight: 400; color: #5f4450; font-size: 1.4rem; margin-bottom: 8px; }
    .wip-card p { color: #a57e8b; line-height: 1.8; }
    html[data-theme="dark"] .wip-card h3 { color: #e9c8d8; }
    html[data-theme="dark"] .wip-card p { color: #a28798; }

    /* ---------- 国际象棋 ---------- */
    .chess-board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: min(528px, calc(100vw - 300px));
      aspect-ratio: 1 / 1;
      border: 3px solid #8a6a52;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .22);
      background: #b58863;
    }
    .chess-square {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      font-size: clamp(26px, 4.6vw, 42px);
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .chess-square.light { background: #f0d9b5; }
    .chess-square.dark { background: #b58863; }
    .chess-pw {
      color: #fff;
      text-shadow: 0 0 2px #333, 0 0 2px #333, 1px 1px 0 #333, -1px -1px 0 #333;
    }
    .chess-pb {
      color: #232323;
      text-shadow: 0 0 2px rgba(255, 255, 255, .3);
    }
    .chess-square.selected { box-shadow: inset 0 0 0 3px #f5c542; z-index: 2; }
    .chess-square.move-hint::after {
      content: '';
      position: absolute;
      width: 24%;
      height: 24%;
      border-radius: 50%;
      background: rgba(40, 130, 70, .38);
    }
    .chess-square.capture-hint { box-shadow: inset 0 0 0 3px rgba(215, 60, 60, .6); }
    .chess-square.just-moved { animation: chess-pop .35s var(--ease); }
    @keyframes chess-pop { 50% { transform: scale(1.16); } }
    .chess-square .coord {
      position: absolute;
      font-size: 10px;
      line-height: 1;
      pointer-events: none;
    }
    .chess-square.light .coord { color: rgba(70, 50, 35, .5); }
    .chess-square.dark .coord { color: rgba(240, 225, 200, .55); }
    .chess-square .coord--file { left: 3px; bottom: 1px; }
    .chess-square .coord--rank { top: 1px; right: 3px; }
    /* 摆棋动画：棋子从右下角错峰飞回原位 */
    .chess-fly {
      position: absolute;
      width: 12.5%;
      height: 12.5%;
      display: grid;
      place-items: center;
      font-size: clamp(26px, 4.6vw, 42px);
      line-height: 1;
      pointer-events: none;
      z-index: 3;
      transform: translate(-50%, -50%);
      transition: left .45s var(--ease), top .45s var(--ease);
      will-change: left, top;
    }

    /* ---------- 移动端：导航变顶栏 ---------- */
    @media (max-width: 920px) {
      body { padding: 128px 14px 48px; }
      .side-nav {
        top: 0; bottom: auto; width: 100%; height: auto;
        flex-direction: row; align-items: center; flex-wrap: wrap;
        padding: 10px 12px; gap: 6px;
        border-right: none; border-bottom: 1.5px solid rgba(236, 143, 178, .3);
      }
      .side-nav__logo { padding: 0 8px 0 2px; font-size: 1.2rem; }
      .side-nav__item { padding: 8px 12px; font-size: .95rem; }
      .side-nav__spacer { display: none; }
      .side-nav__home { margin-left: auto; }
      .xq-main { flex-direction: column; align-items: center; }
      .xq-side { width: min(528px, calc(100vw - 28px)); }
      #board { width: min(528px, calc(100vw - 28px)); }
      #gboard { width: min(720px, calc(100vw - 28px)); }
      .chess-board { width: min(528px, calc(100vw - 28px)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .page-open { display: none; }
      .side-nav__item, .btns button { transition: none !important; }
    }
  </style>
</head>
<body>

  <script>
    /*ENGINE-START*/
    /* ================================================================
       象棋引擎（无 DOM 依赖，可提取到 node 跑 perft 验证）
       board[y][x]：y0=黑方底线，y9=红方底线；大写=红，小写=黑
       ================================================================ */
    var XqEngine = (function () {
      'use strict';

      var INITIAL = [
        'rheakaehr',
        '.........',
        '.c.....c.',
        'p.p.p.p.p',
        '.........',
        '.........',
        'P.P.P.P.P',
        '.C.....C.',
        '.........',
        'RHEAKAEHR'
      ];
      var ORTHO = [[0, 1], [0, -1], [1, 0], [-1, 0]];
      var DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
      var VAL = { k: 100000, r: 600, c: 300, h: 270, e: 120, a: 120, p: 60 };

      function isRed(p) { return p >= 'A' && p <= 'Z'; }
      function isBlack(p) { return p >= 'a' && p <= 'z'; }
      function cloneBoard(b) { return b.map(function (row) { return row.split(''); }); }

      function addIf(out, b, x, y, nx, ny, side) {
        if (nx < 0 || nx > 8 || ny < 0 || ny > 9) return false;
        var t = b[ny][nx];
        if (t === '.') { out.push({ x1: x, y1: y, x2: nx, y2: ny }); return true; }
        if ((side > 0 && isBlack(t)) || (side < 0 && isRed(t))) {
          out.push({ x1: x, y1: y, x2: nx, y2: ny, cap: t });
        }
        return false;
      }

      function pseudoMoves(b, side) {
        var out = [];
        for (var y = 0; y < 10; y++) for (var x = 0; x < 9; x++) {
          var p = b[y][x];
          if (p === '.') continue;
          var red = isRed(p);
          if ((side > 0) !== red) continue;
          var k = p.toLowerCase();
          var i, nx, ny;
          if (k === 'k') {
            for (i = 0; i < 4; i++) {
              nx = x + ORTHO[i][0]; ny = y + ORTHO[i][1];
              if (nx >= 3 && nx <= 5 && (red ? (ny >= 7 && ny <= 9) : (ny >= 0 && ny <= 2)))
                addIf(out, b, x, y, nx, ny, side);
            }
            var step = red ? -1 : 1;
            for (ny = y + step; ny >= 0 && ny <= 9; ny += step) {
              var t = b[ny][x];
              if (t === '.') continue;
              if (t === (red ? 'k' : 'K')) out.push({ x1: x, y1: y, x2: x, y2: ny, cap: t, fly: true });
              break;
            }
          } else if (k === 'a') {
            for (i = 0; i < 4; i++) {
              nx = x + DIAG[i][0]; ny = y + DIAG[i][1];
              if (nx >= 3 && nx <= 5 && (red ? (ny >= 7 && ny <= 9) : (ny >= 0 && ny <= 2)))
                addIf(out, b, x, y, nx, ny, side);
            }
          } else if (k === 'e') {
            for (i = 0; i < 4; i++) {
              nx = x + DIAG[i][0] * 2; ny = y + DIAG[i][1] * 2;
              if (nx < 0 || nx > 8 || ny < 0 || ny > 9) continue;
              if (red ? ny < 5 : ny > 4) continue;
              if (b[y + DIAG[i][1]][x + DIAG[i][0]] !== '.') continue;
              addIf(out, b, x, y, nx, ny, side);
            }
          } else if (k === 'h') {
            var legs = [[1, 2], [-1, 2], [1, -2], [-1, -2], [2, 1], [2, -1], [-2, 1], [-2, -1]];
            for (i = 0; i < 8; i++) {
              var d = legs[i];
              nx = x + d[0]; ny = y + d[1];
              if (nx < 0 || nx > 8 || ny < 0 || ny > 9) continue;
              var lx = Math.abs(d[0]) === 2 ? x + d[0] / 2 : x;
              var ly = Math.abs(d[1]) === 2 ? y + d[1] / 2 : y;
              if (b[ly][lx] !== '.') continue;
              addIf(out, b, x, y, nx, ny, side);
            }
          } else if (k === 'r') {
            for (i = 0; i < 4; i++) {
              nx = x + ORTHO[i][0]; ny = y + ORTHO[i][1];
              while (addIf(out, b, x, y, nx, ny, side)) { nx += ORTHO[i][0]; ny += ORTHO[i][1]; }
            }
          } else if (k === 'c') {
            for (i = 0; i < 4; i++) {
              nx = x + ORTHO[i][0]; ny = y + ORTHO[i][1];
              var jumped = false;
              while (nx >= 0 && nx <= 8 && ny >= 0 && ny <= 9) {
                var t2 = b[ny][nx];
                if (!jumped) {
                  if (t2 === '.') out.push({ x1: x, y1: y, x2: nx, y2: ny });
                  else jumped = true;
                } else if (t2 !== '.') {
                  if ((side > 0 && isBlack(t2)) || (side < 0 && isRed(t2)))
                    out.push({ x1: x, y1: y, x2: nx, y2: ny, cap: t2 });
                  break;
                }
                nx += ORTHO[i][0]; ny += ORTHO[i][1];
              }
            }
          } else if (k === 'p') {
            addIf(out, b, x, y, x, y + (red ? -1 : 1), side);
            var crossed = red ? y <= 4 : y >= 5;
            if (crossed) {
              addIf(out, b, x, y, x - 1, y, side);
              addIf(out, b, x, y, x + 1, y, side);
            }
          }
        }
        return out;
      }

      function findKing(b, side) {
        var kc = side > 0 ? 'K' : 'k';
        for (var y = 0; y < 10; y++) for (var x = 0; x < 9; x++)
          if (b[y][x] === kc) return { x: x, y: y };
        return null;
      }

      function inCheck(b, side) {
        var kp = findKing(b, side);
        if (!kp) return true;
        var enemy = pseudoMoves(b, -side);
        for (var i = 0; i < enemy.length; i++)
          if (enemy[i].x2 === kp.x && enemy[i].y2 === kp.y) return true;
        return false;
      }

      function applyMove(b, m) {
        var cap = b[m.y2][m.x2];
        b[m.y2][m.x2] = b[m.y1][m.x1];
        b[m.y1][m.x1] = '.';
        return cap;
      }
      function undoMove(b, m, cap) {
        b[m.y1][m.x1] = b[m.y2][m.x2];
        b[m.y2][m.x2] = cap;
      }

      function legalMoves(b, side) {
        var ps = pseudoMoves(b, side), out = [];
        for (var i = 0; i < ps.length; i++) {
          var cap = applyMove(b, ps[i]);
          if (!inCheck(b, side)) out.push(ps[i]);
          undoMove(b, ps[i], cap);
        }
        return out;
      }

      /* 着法计数测试：d1=44, d2=1920, d3=79666 为象棋标准答案 */
      function perft(b, depth, side) {
        if (depth === 0) return 1;
        var ms = legalMoves(b, side), n = 0;
        for (var i = 0; i < ms.length; i++) {
          var cap = applyMove(b, ms[i]);
          n += perft(b, depth - 1, -side);
          undoMove(b, ms[i], cap);
        }
        return n;
      }

      function evaluate(b) {
        var s = 0;
        for (var y = 0; y < 10; y++) for (var x = 0; x < 9; x++) {
          var p = b[y][x];
          if (p === '.') continue;
          var red = isRed(p);
          var k = p.toLowerCase();
          var v = VAL[k];
          if (k === 'p') {
            if (red) { if (y <= 4) v += 30 + (4 - y) * 6; }
            else { if (y >= 5) v += 30 + (y - 5) * 6; }
          } else if (k === 'h') {
            v += (x === 0 || x === 8) ? -18 : (x >= 3 && x <= 5 ? 12 : 0);
          } else if (k === 'c') {
            if (x === 4) v += 10;
          }
          s += red ? v : -v;
        }
        return s;
      }

      function orderMoves(b, ms) {
        ms.sort(function (a, z) {
          return (z.cap ? VAL[z.cap.toLowerCase()] : 0) - (a.cap ? VAL[a.cap.toLowerCase()] : 0);
        });
      }

      function search(b, depth, side, alpha, beta) {
        if (depth === 0) return side * evaluate(b);
        var ms = legalMoves(b, side);
        if (!ms.length) return -99999 - depth;
        orderMoves(b, ms);
        var best = -Infinity;
        for (var i = 0; i < ms.length; i++) {
          var cap = applyMove(b, ms[i]);
          var sc = -search(b, depth - 1, -side, -beta, -alpha);
          undoMove(b, ms[i], cap);
          if (sc > best) best = sc;
          if (best > alpha) alpha = best;
          if (alpha >= beta) break;
        }
        return best;
      }

      function searchRoot(b, side, depth) {
        var ms = legalMoves(b, side);
        if (!ms.length) return null;
        orderMoves(b, ms);
        var best = ms[0], bestScore = -Infinity;
        for (var i = 0; i < ms.length; i++) {
          var cap = applyMove(b, ms[i]);
          var sc = -search(b, depth - 1, -side, -Infinity, Infinity) + (Math.random() * 8 - 4);
          undoMove(b, ms[i], cap);
          if (sc > bestScore) { bestScore = sc; best = ms[i]; }
        }
        return { move: best, score: bestScore };
      }

      return {
        INITIAL: INITIAL, cloneBoard: cloneBoard, isRed: isRed, isBlack: isBlack,
        legalMoves: legalMoves, applyMove: applyMove, undoMove: undoMove,
        inCheck: inCheck, perft: perft, searchRoot: searchRoot
      };
    })();
    if (typeof module !== 'undefined') module.exports = XqEngine;
    /*ENGINE-END*/
  </script>

  <script>
    (function () {
      'use strict';

      /* ================================================================
         对弈 UI：Canvas 棋盘 + 点击走子 + 动画 + 小灯泡
         ================================================================ */
      var E = XqEngine;
      var canvas = document.getElementById('board');
      var ctx = canvas.getContext('2d');
      var CELL = 58, OX = 32, OY = 30;
      var CHARS = {
        K: '帅', A: '仕', E: '相', H: '马', R: '车', C: '炮', P: '兵',
        k: '将', a: '士', e: '象', h: '马', r: '车', c: '炮', p: '卒'
      };
      var RED = '#c0392b', BLACK = '#3a3a3a';
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var board, turn, playerSide, aiSide, selected, legalForSel, history, lastMove, over, noCapPly;
      var anim = null;        // 走子滑动动画 {ch,color,fx,fy,tx,ty,t0,dur,k}
      var resetAnim = null;   // 重开摆子动画 {t0,dur,el}
      var hint = null, hintUsed = false;

      var statusEl = document.getElementById('status');
      var sideSel = document.getElementById('sideSel');
      var undoBtn = document.getElementById('undoBtn');
      var drawBtn = document.getElementById('drawBtn');
      var resetBtn = document.getElementById('resetBtn');
      var resignBtn = document.getElementById('resignBtn');
      var hintBtn = document.getElementById('hintBtn');
      var AI_DEPTH = 4;   // 固定困难
      var gameId = 0;       // 防上一局的"小圣思考中"定时器落到新局

      function init(side, sources) {
        gameId++;
        board = E.cloneBoard(E.INITIAL);
        turn = 1;
        playerSide = side;
        aiSide = -side;
        selected = null;
        legalForSel = [];
        history = [];
        lastMove = null;
        over = false;
        noCapPly = 0;
        anim = null;
        hint = null;
        hintUsed = false;
        hintBtn.disabled = false;
        hintBtn.textContent = '💡 小灯泡（1/1）';
        tray = [];
        render();
        updateStatus();
        if (sources && sources.length) flyHome(sources);   // 棋子飞回各自初始位
        if (turn === aiSide) aiTurn();
      }

      /* ---------- 托盘（右下角战利品区：吃掉的棋子按棋子样子停在这） ---------- */
      var tray = [];          // [{ch, color}] 按吃子顺序停放
      var TRAY_TOP = 596;     // 托盘区起点（canvas 高度 678，板区 582）
      function traySlot(i) {  // 第 i 个停放位（像素坐标，右对齐，一排 7 个折行）
        var col = i % 7, row = Math.floor(i / 7);
        return { x: canvas.width - 26 - col * 42, y: TRAY_TOP + 26 + row * 44 };
      }

      /* ---------- 动画（rAF 可能被节流/停发，setTimeout 兜底必达 ---------- */
      function animateMove(piece, m, done) {
        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          anim = null;
          render();
          done();
        }
        if (reduceMotion) { finish(); return; }
        anim = {
          ch: CHARS[piece], color: E.isRed(piece) ? RED : BLACK,
          fx: m.x1, fy: m.y1, tx: m.x2, ty: m.y2,
          t0: performance.now(), dur: 180, k: 0
        };
        setTimeout(finish, anim.dur + 60);   // rAF 被节流时的兜底
        requestAnimationFrame(function fr(t) {
          if (finished || !anim) return;
          anim.k = (t - anim.t0) / anim.dur;
          if (anim.k >= 1) { finish(); return; }
          render();
          requestAnimationFrame(fr);
        });
      }

      /* 被吃的棋子飞进托盘（capFly 渲染态） */
      var capFly = null;
      function flyCap(cap, fromX, fromY, done) {
        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          tray.push({ ch: CHARS[cap], color: E.isRed(cap) ? RED : BLACK, key: cap });
          capFly = null;
          render();
          done();
        }
        if (reduceMotion || tray.length >= 14) { finish(); return; }
        var slot = traySlot(tray.length);
        capFly = {
          ch: CHARS[cap], color: E.isRed(cap) ? RED : BLACK,
          fx: px(vx(fromX)), fy: py(vy(fromY)), tx: slot.x, ty: slot.y,
          t0: performance.now(), dur: 260, k: 0
        };
        setTimeout(finish, capFly.dur + 60);
        requestAnimationFrame(function fr(t) {
          if (finished || !capFly) return;
          capFly.k = (t - capFly.t0) / capFly.dur;
          if (capFly.k >= 1) { finish(); return; }
          render();
          requestAnimationFrame(fr);
        });
      }
      /* 悔棋时：被吃的棋子从托盘飞回原位 */
      function flyCapBack(cap, toX, toY, done) {
        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          capFly = null;
          render();
          done();
        }
        /* 从托盘末尾找同类棋子摘掉（按引擎键值匹配：车/马/炮红黑同字，ch 会摘错） */
        var idx = -1;
        for (var i = tray.length - 1; i >= 0; i--) {
          if (tray[i].key === cap) { idx = i; break; }
        }
        if (idx < 0) { finish(); return; }
        var slot = traySlot(idx);
        tray.splice(idx, 1);
        if (reduceMotion) { finish(); return; }
        capFly = {
          ch: CHARS[cap], color: E.isRed(cap) ? RED : BLACK,
          fx: slot.x, fy: slot.y, tx: px(vx(toX)), ty: py(vy(toY)),
          t0: performance.now(), dur: 240, k: 0, back: true
        };
        setTimeout(finish, capFly.dur + 60);
        requestAnimationFrame(function fr(t) {
          if (finished || !capFly) return;
          capFly.k = (t - capFly.t0) / capFly.dur;
          if (capFly.k >= 1) { finish(); return; }
          render();
          requestAnimationFrame(fr);
        });
      }

      /* 重开摆棋：所有棋子（棋盘上 + 托盘里）飞回自己的初始位置 */
      var resetFly = null;   // {sprites:[{ch,color,fx,fy,tx,ty,dly}], t0, el}
      function homeSquares() {
        /* 从 INITIAL 收集每类子的初始位：{char: [(x,y),...]} */
        var map = {};
        for (var y = 0; y < 10; y++) for (var x = 0; x < 9; x++) {
          var p = E.INITIAL[y][x];
          if (p === '.') continue;
          (map[p] = map[p] || []).push({ x: x, y: y });
        }
        return map;
      }
      function flyHome(sources) {
        /* sources: [{ch, color, fx, fy, key}]（像素坐标 + 引擎键值）；
           按 key 分配初始位——不能用汉字反查：车/马/炮红黑同字，会把红子分到黑位 */
        var homes = homeSquares();
        var used = {};
        var sprites = sources.map(function (s, i) {
          var list = homes[s.key];
          var u = used[s.key] || 0;
          used[s.key] = u + 1;
          var home = list[Math.min(u, list.length - 1)];
          return {
            ch: s.ch, color: s.color, fx: s.fx, fy: s.fy,
            tx: px(vx(home.x)), ty: py(vy(home.y)), dly: i * 20
          };
        });
        board = E.cloneBoard(E.INITIAL);   // 棋盘状态直接归位，动画只负责"飞"
        tray = [];
        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          resetFly = null;
          render();
        }
        if (reduceMotion) { finish(); return; }
        resetFly = { sprites: sprites, t0: performance.now(), el: 0 };
        var total = 380 + sprites.length * 20;
        setTimeout(finish, total + 100);
        requestAnimationFrame(function fr(t) {
          if (finished || !resetFly) return;
          resetFly.el = t - resetFly.t0;
          if (resetFly.el >= total) { finish(); return; }
          render();
          requestAnimationFrame(fr);
        });
      }

      /* ---------- 绘制 ---------- */
      function px(x) { return OX + x * CELL; }
      function py(y) { return OY + y * CELL; }
      function vx(x) { return playerSide === 1 ? x : 8 - x; }
      function vy(y) { return playerSide === 1 ? y : 9 - y; }

      function render() {
        ctx.fillStyle = '#f9e7c3';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#8a6a4a';
        ctx.lineWidth = 1;
        var i, x, y;
        for (y = 0; y < 10; y++) {
          ctx.beginPath(); ctx.moveTo(px(0), py(y)); ctx.lineTo(px(8), py(y)); ctx.stroke();
        }
        for (x = 0; x < 9; x++) {
          ctx.beginPath();
          ctx.moveTo(px(x), py(0)); ctx.lineTo(px(x), py(4));
          ctx.moveTo(px(x), py(5)); ctx.lineTo(px(x), py(9));
          ctx.stroke();
        }
        ctx.beginPath(); ctx.moveTo(px(0), py(4)); ctx.lineTo(px(8), py(4)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px(0), py(5)); ctx.lineTo(px(8), py(5)); ctx.stroke();
        ctx.lineWidth = 3;
        ctx.strokeRect(px(0) - 4, py(0) - 4, CELL * 8 + 8, CELL * 9 + 8);
        ctx.lineWidth = 1;
        function diag(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(px(x1), py(y1)); ctx.lineTo(px(x2), py(y2)); ctx.stroke(); }
        diag(3, 0, 5, 2); diag(5, 0, 3, 2); diag(3, 7, 5, 9); diag(5, 7, 3, 9);
        var stars = [[1, 2], [7, 2], [0, 3], [2, 3], [4, 3], [6, 3], [8, 3], [1, 7], [7, 7], [0, 6], [2, 6], [4, 6], [6, 6], [8, 6]];
        stars.forEach(function (s) { drawStar(px(s[0]), py(s[1])); });
        /* 楚河汉界：同一水平线，河的正中央 */
        ctx.fillStyle = '#8a6a4a';
        ctx.font = '26px KaiTi, STKaiti, serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        var riverY = (py(4) + py(5)) / 2;
        ctx.fillText('楚  河', px(2), riverY);
        ctx.fillText('汉  界', px(6), riverY);

        if (lastMove) {
          ctx.fillStyle = 'rgba(236, 111, 156, .3)';
          ctx.fillRect(px(vx(lastMove.x1)) - 22, py(vy(lastMove.y1)) - 22, 44, 44);
          ctx.fillRect(px(vx(lastMove.x2)) - 22, py(vy(lastMove.y2)) - 22, 44, 44);
        }
        /* 托盘分隔线 */
        ctx.strokeStyle = 'rgba(138, 106, 74, .35)';
        ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.moveTo(14, TRAY_TOP); ctx.lineTo(canvas.width - 14, TRAY_TOP); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = '#8a6a4a';

        /* 棋子（重开回家动画期间不画，由飞行精灵代替） */
        if (!resetFly) {
          for (y = 0; y < 10; y++) for (x = 0; x < 9; x++) {
            var p = board[y][x];
            if (p === '.') continue;
            if (anim && x === anim.tx && y === anim.ty) continue;   // 滑动中的棋子单独画
            drawPiece(px(vx(x)), py(vy(y)), CHARS[p], E.isRed(p) ? RED : BLACK,
              selected && selected.x === x && selected.y === y);
          }
        }
        /* 滑动中的棋子 */
        if (anim) {
          var k = anim.k < 0 ? 0 : (anim.k > 1 ? 1 : anim.k);
          var ease = 1 - Math.pow(1 - k, 2);
          var cx = px(vx(anim.fx)) + (px(vx(anim.tx)) - px(vx(anim.fx))) * ease;
          var cy = py(vy(anim.fy)) + (py(vy(anim.ty)) - py(vy(anim.fy))) * ease;
          drawPiece(cx, cy, anim.ch, anim.color, false);
        }
        /* 托盘里停放的战利品（小号棋子） */
        tray.forEach(function (t, i) {
          var s = traySlot(i);
          drawPieceSmall(s.x, s.y, t.ch, t.color);
        });
        /* 正在飞的被吃棋子（飞去/飞回托盘） */
        if (capFly) {
          var ck = capFly.k < 0 ? 0 : (capFly.k > 1 ? 1 : capFly.k);
          var ce = 1 - Math.pow(1 - ck, 2);
          var ccx = capFly.fx + (capFly.tx - capFly.fx) * ce;
          var ccy = capFly.fy + (capFly.ty - capFly.fy) * ce;
          var scale = capFly.back ? (0.7 + 0.3 * ce) : (1 - 0.3 * ce);   // 飞走渐小、飞回渐大
          drawPieceScaled(ccx, ccy, capFly.ch, capFly.color, scale);

        /* 重开：全体棋子飞回初始位 */
        if (resetFly) {
          resetFly.sprites.forEach(function (sp) {
            var kk = (resetFly.el - sp.dly) / 380;
            if (kk <= 0) return;
            kk = kk > 1 ? 1 : kk;
            var se = 1 - Math.pow(1 - kk, 2);
            drawPiece(sp.fx + (sp.tx - sp.fx) * se, sp.fy + (sp.ty - sp.fy) * se, sp.ch, sp.color, false);
          });
        }
        /* 合法落点 */
        if (selected) {
          legalForSel.forEach(function (m) {
            var cx = px(vx(m.x2)), cy = py(vy(m.y2));
            if (m.cap) {
              ctx.strokeStyle = 'rgba(217, 79, 130, .9)';
              ctx.lineWidth = 3;
              ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.stroke();
              ctx.lineWidth = 1;
            } else {
              ctx.fillStyle = 'rgba(80, 160, 90, .55)';
              ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2); ctx.fill();
            }
          });
        }
        /* 小灯泡提示箭头 */
        if (hint) {
          var hx1 = px(vx(hint.x1)), hy1 = py(vy(hint.y1));
          var hx2 = px(vx(hint.x2)), hy2 = py(vy(hint.y2));
          ctx.strokeStyle = 'rgba(237, 169, 58, .95)';
          ctx.lineWidth = 5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(hx1, hy1);
          ctx.lineTo(hx2, hy2);
          ctx.stroke();
          ctx.lineWidth = 1;
          /* 箭头头部 */
          var ang = Math.atan2(hy2 - hy1, hx2 - hx1);
          ctx.fillStyle = 'rgba(237, 169, 58, .95)';
          ctx.beginPath();
          ctx.moveTo(hx2, hy2);
          ctx.lineTo(hx2 - 16 * Math.cos(ang - 0.45), hy2 - 16 * Math.sin(ang - 0.45));
          ctx.lineTo(hx2 - 16 * Math.cos(ang + 0.45), hy2 - 16 * Math.sin(ang + 0.45));
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = 'rgba(237, 169, 58, .7)';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(hx1, hy1, 27, 0, Math.PI * 2); ctx.stroke();
          ctx.lineWidth = 1;
        }
      }

      function drawStar(cx, cy) {
        var g = 4, l = 8;
        ctx.strokeStyle = '#8a6a4a';
        [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (d) {
          ctx.beginPath();
          ctx.moveTo(cx + d[0] * g, cy + d[1] * (g + l));
          ctx.lineTo(cx + d[0] * g, cy + d[1] * g);
          ctx.lineTo(cx + d[0] * (g + l), cy + d[1] * g);
          ctx.stroke();
        });
      }

      function drawPiece(cx, cy, ch, color, isSel) {
        drawPieceScaled(cx, cy, ch, color, 1, isSel);
      }
      function drawPieceScaled(cx, cy, ch, color, scale, isSel) {
        ctx.beginPath(); ctx.arc(cx, cy, 23 * scale, 0, Math.PI * 2);
        ctx.fillStyle = '#fdf3d8'; ctx.fill();
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
        if (isSel) {
          ctx.strokeStyle = '#50a05a'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(cx, cy, 26 * scale, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = color;
        ctx.font = 'bold ' + Math.round(24 * scale) + 'px KaiTi, STKaiti, serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ch, cx, cy + 1);
      }
      function drawPieceSmall(cx, cy, ch, color) {
        drawPieceScaled(cx, cy, ch, color, 0.74, false);
      }

      /* ---------- 走子 ---------- */
      function cellFromEvent(e) {
        var r = canvas.getBoundingClientRect();
        var mx = (e.clientX - r.left) * (canvas.width / r.width);
        var my = (e.clientY - r.top) * (canvas.height / r.height);
        var bx = Math.round((mx - OX) / CELL), by = Math.round((my - OY) / CELL);
        if (bx < 0 || bx > 8 || by < 0 || by > 9) return null;
        return { x: playerSide === 1 ? bx : 8 - bx, y: playerSide === 1 ? by : 9 - by };
      }

      canvas.addEventListener('click', function (e) {
        /* 走子滑动/吃子飞行/回家动画期间锁输入：回合未交接时连点会叠子（竞态踩过） */

  <script>
    /* ================================================================
       五子棋（15×15 人机对战）：你执黑/白可选，小圣对家
       AI = 单步启发式（攻其一点 + 防其一点，活四冲四活三模式分）
       ================================================================ */
    (function () {
      'use strict';

      var canvas = document.getElementById('gboard');
      var ctx = canvas.getContext('2d');
      var N = 15, CELL = 40, GOX = 140, GOY = 30;   // 棋盘区 140..700，左右各 110/140 留给棋盒
      var EMPTY = 0, BLACK = 1, WHITE = 2;
      var BOX_B = { x: 62, y: 310 }, BOX_W = { x: 778, y: 310 };   // 黑盒在左，白盒在右
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var gb, gturn, gplayer, gai, ghist, gLast, gover, ganim, gWinLine;
      var gfly = null;   // 棋子飞回棋盒的群体动画 {sprites, t0, el}

      var statusEl = document.getElementById('gstatus');
      var sideSel = document.getElementById('gsideSel');
      var undoBtn = document.getElementById('gundoBtn');
      var resetBtn = document.getElementById('gresetBtn');
      var resignBtn = document.getElementById('gresignBtn');

      function ginit(side) {
        gb = [];
        for (var y = 0; y < N; y++) { gb.push(new Array(N).fill(EMPTY)); }
        gturn = BLACK;
        gplayer = side;
        gai = side === BLACK ? WHITE : BLACK;
        ghist = [];
        gLast = null;
        gover = false;
        ganim = null;
        gWinLine = null;
        undoBtn.disabled = true;
        render();
        updateStatus();
        if (gturn === gai) gaiTurn();
      }

      /* ---------- 绘制 ---------- */
      function gp(x) { return GOX + x * CELL; }
      function gy(y) { return GOY + y * CELL; }
      /* 棋盒：木碗 + 三颗装饰子 */
      function drawBowl(cx, cy, color) {
        var g = ctx.createRadialGradient(cx - 12, cy - 14, 8, cx, cy, 50);
        g.addColorStop(0, '#b58960'); g.addColorStop(1, '#7a5232');
        ctx.beginPath(); ctx.arc(cx, cy, 46, 0, Math.PI * 2);
        ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = '#5d3f24'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, 34, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(60, 40, 26, .55)'; ctx.fill();
        ctx.lineWidth = 1;
        drawStone(cx - 10, cy - 5, color, 0.68);
        drawStone(cx + 12, cy - 2, color, 0.68);
        drawStone(cx + 1, cy + 11, color, 0.68);
      }
      function render() {
        ctx.fillStyle = '#f9e7c3';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#8a6a4a';
        ctx.lineWidth = 1;
        var i;
        for (i = 0; i < N; i++) {
          ctx.beginPath(); ctx.moveTo(gp(0), gy(i)); ctx.lineTo(gp(N - 1), gy(i)); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(gp(i), gy(0)); ctx.lineTo(gp(i), gy(N - 1)); ctx.stroke();
        }
        ctx.lineWidth = 3;
        ctx.strokeRect(gp(0) - 4, gy(0) - 4, CELL * (N - 1) + 8, CELL * (N - 1) + 8);
        /* 星位 */
        ctx.fillStyle = '#8a6a4a';
        [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]].forEach(function (s) {
          ctx.beginPath(); ctx.arc(gp(s[0]), gy(s[1]), 4, 0, Math.PI * 2); ctx.fill();
        });
        /* 棋子 */
        for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
          var p = gb[y][x];
          if (p === EMPTY) continue;
          if (ganim && ganim.x === x && ganim.y === y) continue;   // 飞行中的新子单独画
          drawStone(gp(x), gy(y), p, 1);
        }
        /* 最后一手标记 */
        if (gLast && !gfly) {
          ctx.fillStyle = 'rgba(236, 111, 156, .9)';
          ctx.beginPath(); ctx.arc(gp(gLast.x), gy(gLast.y), 5, 0, Math.PI * 2); ctx.fill();
        }
        /* 五连胜子高亮圈 */
        if (gWinLine) {
          ctx.strokeStyle = 'rgba(217, 79, 130, .9)';
          ctx.lineWidth = 3;
          gWinLine.forEach(function (c) {
            ctx.beginPath(); ctx.arc(gp(c.x), gy(c.y), 20, 0, Math.PI * 2); ctx.stroke();
          });
          ctx.lineWidth = 1;
        }
        /* 落子飞行：从棋盒飞到落点 */
        if (ganim) {
          var k = Math.max(0, Math.min(1, ganim.k));
          var e = 1 - Math.pow(1 - k, 2);
          var cx = ganim.fx + (ganim.tx - ganim.fx) * e;
          var cy = ganim.fy + (ganim.ty - ganim.fy) * e;
          drawStone(cx, cy, ganim.color, 0.6 + 0.4 * e);
        }
        /* 群体飞回棋盒 */
        if (gfly) {
          gfly.sprites.forEach(function (sp) {
            var kk = (gfly.el - sp.dly) / 300;
            if (kk <= 0) return;
            kk = kk > 1 ? 1 : kk;
            var se = 1 - Math.pow(1 - kk, 2);
            var sx = sp.fx + (sp.tx - sp.fx) * se;
            var sy = sp.fy + (sp.ty - sp.fy) * se;
            ctx.globalAlpha = 1 - se * 0.85;                  // 落进盒里渐隐
            drawStone(sx, sy, sp.color, 1 - 0.3 * se);
            ctx.globalAlpha = 1;
          });
        }
        /* 棋盒画在最上层：飞回的棋子像落进碗里 */
        drawBowl(BOX_B.x, BOX_B.y, BLACK);
        drawBowl(BOX_W.x, BOX_W.y, WHITE);
      }

      function drawStone(cx, cy, color, scale) {
        var r = 17 * scale;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
        if (color === BLACK) {
          var g = ctx.createRadialGradient(cx - r / 3, cy - r / 3, r / 6, cx, cy, r);
          g.addColorStop(0, '#666'); g.addColorStop(1, '#1a1a1a');
          ctx.fillStyle = g;
        } else {
          ctx.fillStyle = '#fdf8ec';
        }
        ctx.fill();
        ctx.strokeStyle = color === BLACK ? '#000' : '#c9b393';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      /* ---------- 落子动画：棋子从棋盒飞到落点（rAF + setTimeout 兜底） ---------- */
      function playStone(x, y, color, done) {
        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          ganim = null;
          render();
          done();
        }
        if (reduceMotion) { finish(); return; }
        var box = color === BLACK ? BOX_B : BOX_W;
        ganim = {
          fx: box.x, fy: box.y, tx: gp(x), ty: gy(y),
          x: x, y: y, color: color, t0: performance.now(), dur: 190, k: 0
        };
        setTimeout(finish, ganim.dur + 60);
        requestAnimationFrame(function fr(t) {
          if (finished || !ganim) return;
          ganim.k = (t - ganim.t0) / ganim.dur;
          if (ganim.k >= 1) { finish(); return; }
          render();
          requestAnimationFrame(fr);
        });
      }

      /* ---------- 棋子飞回棋盒（悔棋/重开共用） ---------- */
      function flyToBox(cells, done) {
        if (!cells.length) { if (done) done(); return; }
        if (reduceMotion) { if (done) done(); return; }
        var sprites = cells.map(function (c, i) {
          var box = c.color === BLACK ? BOX_B : BOX_W;
          return { fx: gp(c.x), fy: gy(c.y), tx: box.x, ty: box.y, color: c.color, dly: i * 35 };
        });
        gfly = { sprites: sprites, t0: performance.now(), el: 0 };
        var total = 300 + sprites.length * 35;
        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          gfly = null;
          render();
          if (done) done();
        }
        setTimeout(finish, total + 80);
        requestAnimationFrame(function fr(t) {
          if (finished || !gfly) return;
          gfly.el = t - gfly.t0;
          if (gfly.el >= total) { finish(); return; }
          render();
          requestAnimationFrame(fr);
        });
      }

      /* ---------- 胜负判定：返回五连坐标数组或 null ---------- */
      function winLine(x, y, color) {
        var dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
        for (var d = 0; d < 4; d++) {
          var dx = dirs[d][0], dy = dirs[d][1];
          var cells = [{ x: x, y: y }];
          var i;
          for (i = 1; i < 5; i++) {
            var nx = x + dx * i, ny = y + dy * i;
            if (nx < 0 || nx >= N || ny < 0 || ny >= N || gb[ny][nx] !== color) break;
            cells.push({ x: nx, y: ny });
          }
          for (i = 1; i < 5; i++) {
            nx = x - dx * i; ny = y - dy * i;
            if (nx < 0 || nx >= N || ny < 0 || ny >= N || gb[ny][nx] !== color) break;
            cells.push({ x: nx, y: ny });
          }
          if (cells.length >= 5) return cells;
        }
        return null;
      }

      /* ---------- AI：单步启发式 ---------- */
      function candidates() {
        var out = [], any = false;
        var y, x, yy, xx;
        for (y = 0; y < N; y++) for (x = 0; x < N; x++) if (gb[y][x] !== EMPTY) any = true;
        if (!any) return [{ x: 7, y: 7 }];
        for (y = 0; y < N; y++) for (x = 0; x < N; x++) {
          if (gb[y][x] !== EMPTY) continue;
          var near = false;
          for (yy = Math.max(0, y - 2); yy <= Math.min(N - 1, y + 2) && !near; yy++)
            for (xx = Math.max(0, x - 2); xx <= Math.min(N - 1, x + 2); xx++)
              if (gb[yy][xx] !== EMPTY) { near = true; break; }
          if (near) out.push({ x: x, y: y });
        }
        return out;
      }
      function patternScore(count, open) {
        if (count >= 5) return 10000000;
        if (count === 4) return open === 2 ? 1000000 : (open === 1 ? 100000 : 0);
        if (count === 3) return open === 2 ? 50000 : (open === 1 ? 2000 : 0);
        if (count === 2) return open === 2 ? 5000 : (open === 1 ? 500 : 0);
        return open === 2 ? 300 : (open === 1 ? 50 : 0);
      }
      function evalPoint(x, y, color) {
        var total = 0;
        var dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
        for (var d = 0; d < 4; d++) {
          var dx = dirs[d][0], dy = dirs[d][1];
          var count = 1, open = 0, i, nx, ny;
          for (i = 1; i < 5; i++) {
            nx = x + dx * i; ny = y + dy * i;
            if (nx < 0 || nx >= N || ny < 0 || ny >= N || gb[ny][nx] !== color) break;
            count++;
          }
          if (nx >= 0 && nx < N && ny >= 0 && ny < N && gb[ny][nx] === EMPTY) open++;
          for (i = 1; i < 5; i++) {
            nx = x - dx * i; ny = y - dy * i;
            if (nx < 0 || nx >= N || ny < 0 || ny >= N || gb[ny][nx] !== color) break;
            count++;
          }
          if (nx >= 0 && nx < N && ny >= 0 && ny < N && gb[ny][nx] === EMPTY) open++;
          total += patternScore(count, open);
        }
        return total;
      }
      function bestMove() {
        var cands = candidates();
        var best = cands[0], bestScore = -Infinity;
        for (var i = 0; i < cands.length; i++) {
          var c = cands[i];
          var atk = evalPoint(c.x, c.y, gai);
          var def = evalPoint(c.x, c.y, gplayer);
          var s = atk * 1.05 + def + Math.random() * 8;
          if (s > bestScore) { bestScore = s; best = c; }
        }
        return best;
      }

      /* ---------- 流程 ---------- */
      function place(x, y, color, done) {
        gb[y][x] = color;
        ghist.push({ x: x, y: y, color: color });
        gLast = { x: x, y: y };
        playStone(x, y, color, function () {
          var wl = winLine(x, y, color);
          if (wl) {
            gWinLine = wl;
            gover = true;
            render();
            setStatus(color === gplayer ? '五连！你赢了 ✿ 厉害！' : '五连！小圣赢了，再来一局？', color !== gplayer);
            updateButtons();
            return;
          }
          if (ghist.length >= N * N) {
            gover = true;
            setStatus('和棋（棋盘满了）', false);
            updateButtons();
            return;
          }
          gturn = color === BLACK ? WHITE : BLACK;
          updateStatus();
          updateButtons();
          if (!gover && gturn === gai) gaiTurn();
          if (done) done();
        });
      }

      function gaiTurn() {
        setStatus('小圣思考中…', false);
        setTimeout(function () {
          if (gover || gturn !== gai) return;
          var m = bestMove();
          place(m.x, m.y, gai);
        }, 300);
      }

      function cellFromEvent(e) {
        var r = canvas.getBoundingClientRect();
        var mx = (e.clientX - r.left) * (canvas.width / r.width);
        var my = (e.clientY - r.top) * (canvas.height / r.height);
        var bx = Math.round((mx - GOX) / CELL), by = Math.round((my - GOY) / CELL);
        if (bx < 0 || bx >= N || by < 0 || by >= N) return null;
        return { x: bx, y: by };
      }

      canvas.addEventListener('click', function (e) {
        if (gover || ganim || gfly || gturn !== gplayer) return;
        var c = cellFromEvent(e);
        if (!c || gb[c.y][c.x] !== EMPTY) return;
        place(c.x, c.y, gplayer);
      });

      /* 悔棋：连撤两手（AI 应手 + 你上一手），棋子飞回棋盒 */
      undoBtn.addEventListener('click', function () {
        if (ganim || gfly || !ghist.length) return;
        if (!gover && gturn !== gplayer) return;
        gover = false;   // 结束后也允许悔棋：撤掉后恢复对局

        }
        var doneCount = 0;
        list.forEach(function (it, idx) {
          placeTimers.push(setTimeout(function () {
            var span = document.createElement('span');
            span.className = 'chess-fly ' + (it.p === it.p.toUpperCase() ? 'chess-pw' : 'chess-pb');
            span.textContent = GLYPH[it.p];
            span.style.left = startX + 'px';
            span.style.top = startY + 'px';
            boardEl.appendChild(span);
            void span.offsetWidth;
            span.style.left = (it.x * cell + cell / 2) + 'px';
            span.style.top = (it.y * cell + cell / 2) + 'px';
            doneCount++;
            if (doneCount === list.length) {
              placeTimers.push(setTimeout(function () {
                placing = false;
                renderBoard();
                if (done) done();
              }, 480));
            }
          }, idx * 22));
        });
        if (!list.length) {
          placing = false;
          renderBoard();
          if (done) done();
        }
      }

      function select(x, y) {
        selected = { x: x, y: y };
        legalCache = [];
        var all = ChessEngine.legalMoves(gs);
        for (var i = 0; i < all.length; i++) {
          if (all[i].from.x === x && all[i].from.y === y) legalCache.push(all[i]);
        }
        renderBoard();
      }

      function doMove(mv, color) {
        var undo = ChessEngine.makeMove(gs, mv);
        history.push({ mv: mv, color: color, undo: undo });
        lastMove = mv;
        selected = null;
        legalCache = [];
        renderBoard();
        refreshStatus();
      }

      function maybeAiTurn() {
        if (gameOver || thinking) return;
        if (gs.turn === playerColor) return;
        thinking = true;
        refreshStatus();
        setTimeout(function () {
          var mv = ChessEngine.bestMove(gs, 3);
          thinking = false;
          if (mv) {
            doMove(mv, opponentColor());
            maybeAiTurn();
          } else {
            refreshStatus();
          }
        }, 420);
      }

      function resetGame() {
        gs = ChessEngine.makeState();
        selected = null;
        legalCache = [];
        thinking = false;
        gameOver = false;
        gameOverText = '';
        history = [];
        lastMove = null;
        flyPiecesIn(function () {
          refreshStatus();
          if (playerColor === 'b') maybeAiTurn();
        });
      }

      function sqFromEvent(e) {
        var el = e.target;
        while (el && el !== boardEl) {
          if (el.classList && el.classList.contains('chess-square')) return el;
          el = el.parentNode;
        }
        return null;
      }

      boardEl.addEventListener('click', function (e) {
        if (placing || thinking || gameOver) return;
        if (gs.turn !== playerColor) return;
        var sq = sqFromEvent(e);
        if (!sq) return;
        var x = parseInt(sq.getAttribute('data-x'), 10);
        var y = parseInt(sq.getAttribute('data-y'), 10);
        var p = gs.board[y][x];
        if (selected) {
          var mv = null;
          for (var i = 0; i < legalCache.length; i++) {
            if (legalCache[i].to.x === x && legalCache[i].to.y === y) { mv = legalCache[i]; break; }
          }
          if (mv) {
            doMove(mv, playerColor);
            maybeAiTurn();
            return;
          }
          if (p && ChessEngine.colorOf(p) === playerColor) { select(x, y); return; }
          selected = null;
          legalCache = [];
          renderBoard();
          return;
        }
        if (p && ChessEngine.colorOf(p) === playerColor) select(x, y);
      });

      cundoBtn.addEventListener('click', function () {
        if (placing || thinking || !history.length) return;
        gameOver = false;
        gameOverText = '';
        var last = history.pop();
        ChessEngine.unmakeMove(gs, last.undo);
        if (last.color !== playerColor) {
          var prev = history[history.length - 1];
          if (prev) {
            ChessEngine.unmakeMove(gs, prev.undo);
            history.pop();
          }
        }
        selected = null;
        legalCache = [];
        lastMove = history.length ? history[history.length - 1].mv : null;
        renderBoard();
        refreshStatus();
        maybeAiTurn();
      });

      cresetBtn.addEventListener('click', resetGame);

      csideSel.addEventListener('change', function () {
        playerColor = csideSel.value === 'b' ? 'b' : 'w';
        resetGame();
      });

      cresignBtn.addEventListener('click', function () {
        if (placing || gameOver) return;
        gameOver = true;
        gameOverText = '你认输了，小圣赢了 ✿';
        cstatusEl.textContent = gameOverText;
      });

      flyPiecesIn(function () {
        refreshStatus();
        if (playerColor === 'b') maybeAiTurn();
      });
    })();
  </script>
</body>
</html>
